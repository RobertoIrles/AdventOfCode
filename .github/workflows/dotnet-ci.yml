name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.305'

    - name: Restaurar dependencias
      run: dotnet restore csharp/

    - name: Compilar solución
      run: dotnet build csharp/ --no-restore --configuration Release

    - name: Ejecutar pruebas unitarias
      run: dotnet test csharp/ --no-build --configuration Release --verbosity normal